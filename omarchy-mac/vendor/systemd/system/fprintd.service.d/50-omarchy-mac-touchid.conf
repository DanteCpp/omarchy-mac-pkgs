# Touch ID: fprintd opens /dev/sep-bio, a misc device its own unit does not allow.
[Unit]
After=omarchy-mac-touchid-activate.service

[Service]
# /dev/sep-bio appears a few seconds after the Secure Enclave driver binds. Wait
# for it, at most 15 s and only where the driver has a device, so fprintd does
# not start, find no reader and cache "No devices available" until it idles out.
ExecStartPre=/usr/bin/sh -c 'for device in /sys/bus/platform/drivers/apple_sep/*.sep; do [ -e "$device" ] || exit 0; done; attempt=0; while [ ! -e /dev/sep-bio ] && [ "$attempt" -lt 150 ]; do sleep 0.1; attempt=$((attempt + 1)); done; exit 0'
# The class, not the node: a path rule resolves to a device number when the
# cgroup is set up, before ExecStartPre runs, and is dropped if the node is late.
DeviceAllow=char-misc rw
